<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Colección personal de prompts de estilo para transformar fotos, cada uno con su imagen de ejemplo y listo para copiar.">
<title>Prompts de Estilo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d1813'/%3E%3Crect x='9' y='6' width='14' height='20' fill='%23e8a04a'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/sofia-sans-extra-condensed.woff2" as="font" type="font/woff2" crossorigin>
<script>
  document.write('<link rel="stylesheet" href="css/styles.css?v=' + Date.now() + '">');
</script>
<noscript><link rel="stylesheet" href="css/styles.css"></noscript>
</head>
<body>

  <header class="masthead container">
    <h1>Prompts de Estilo</h1>
    <p class="lead">Colección personal. Toca copiar y el prompt es tuyo.</p>
  </header>

  <main id="grid" class="sheet intro container"></main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    <span>Prompt copiado</span>
  </div>

  <footer class="site-footer container">
    <p><span id="count"></span> prompts guardados</p>
    <button id="export-btn" class="export-link" type="button">Exportar valoraciones</button>
  </footer>

  <script>
    (function () {
      var v = Date.now();
      ["js/prompts.js", "js/app.js"].forEach(function (src) {
        document.write('<script src="' + src + '?v=' + v + '"><\/script>');
      });
    })();
  </script>
</body>
</html>
