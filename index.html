<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Prompts de Estilo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6ec4'/%3E%3Cstop offset='1' stop-color='%237c5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='9' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="bg-glow" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <header class="site-header">
    <p class="kicker">Colección personal</p>
    <h1 class="title">Prompts de <span class="title-accent">Estilo</span></h1>
    <p class="subtitle">Toca copiar y el prompt es tuyo</p>
  </header>

  <main id="grid" class="grid"></main>

  <div id="toast" class="toast" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    <span>Prompt copiado</span>
  </div>

  <footer class="site-footer">
    <span id="count"></span> prompts guardados
    <button id="export-btn" class="export-link" type="button">Exportar valoraciones</button>
  </footer>

  <script>
    (function () {
      var v = Date.now();
      ["js/prompts.js", "js/app.js"].forEach(function (src) {
        document.write('<script src="' + src + '?v=' + v + '"><\/script>');
      });
    })();
  </script>
</body>
</html>
